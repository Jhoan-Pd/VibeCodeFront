name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated code matches the .proto files
        run: |
          npm run generate
          git diff --exit-code -- src/gen
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-not-a-real-secret-0123456789
          NEXT_TELEMETRY_DISABLED: "1"
