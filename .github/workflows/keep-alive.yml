name: Keep alive

# Once a day: opens the frontend's /api/health, which in turn wakes the backend (Render's free plan
# sleeps after 15 idle minutes) and runs one database query (Supabase pauses idle free projects).
# It complements Vercel's own daily cron (vercel.json). A failure sends GitHub's usual e-mail.
#
# Set the repository variable FRONTEND_URL (Settings → Secrets and variables → Actions → Variables),
# for example https://vibedecoder.vercel.app
# Note: GitHub disables scheduled workflows after 60 days without commits; re-enable it in the Actions tab.

on:
  schedule:
    - cron: "47 1 * * *" # 20:47 in Bogotá, twelve hours after the backend's own job
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Frontend, backend and database health
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          test -n "$FRONTEND_URL" || { echo "Set the FRONTEND_URL repository variable"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "$FRONTEND_URL/api/health"
          echo
          curl --fail --silent --show-error --max-time 30 -o /dev/null "$FRONTEND_URL/"
